# =====================================================================
#  CAQ-EdgeNet prototype  --  configuration
#  Prototype of Chapter 5: "CAQ-EdgeNet: An Adaptive Framework for Malware
#  Detection in Mobile Industrial IoT Systems"
#  (multi-modal encoder -> conditional attention -> quantisation-aware
#   compression -> RL offloading controller -> classifier + busy-state head)
# =====================================================================
#
#  HOW TO PLUG IN REAL DATA AND TRAINED MODELS  (the only part you must edit)
#  -----------------------------------------------------------------------
#   1. Point data.cic_iot_dir at a folder holding CIC-IoT-2023 CSV files (the
#      merged "part-*.csv" files: 46 flow features + label).  The 34 CIC labels
#      are grouped into the eight classes of Table 5.2 and sub-sampled to its
#      class counts.  Until the folder exists the demo generates a clearly
#      labelled synthetic stand-in with the same 46 features and class counts.
#   2. Device-context (MDF-like) features and the device state are produced by
#      the built-in simulator; a CSV with the seven context columns can replace
#      it through data.context_csv.
#   3. Trained checkpoints written by this demo (models/caq_edgenet.pt,
#      models/policy.pt) are reloaded at start; train them from the dashboard.
#   4. Start:   python run.py
#
#  Paths may be absolute (e.g. /data/... or D:/data/...) or relative to this folder.
# ---------------------------------------------------------------------

data:
  cic_iot_dir: datasets/CIC-IoT-2023             # folder with CIC-IoT-2023 CSVs (absent -> synthetic stand-in flows)
  max_rows_per_file: 150000                      # rows read per CSV file
  context_csv: ""                                # optional CSV with the 7 context columns (battery, cpu, memory, net, active_apps, hour_sin, hour_cos)
  class_counts:                                  # Table 5.2
    Benign: 18240
    DDoS: 12531
    DoS: 8312
    Reconnaissance: 6821
    Mirai: 5213
    Spoofing: 4915
    Brute Force: 3928
    Web Attack: 2491
  split: { train: 0.70, val: 0.15, test: 0.15 } # stratified
  seed: 42

model:                                          # Section 5.2
  checkpoint: models/caq_edgenet.pt             # written by the dashboard's "Train detector"; reloaded at start
  policy: models/policy.pt                      # written by "Train controller"
  h_flow: 64                                    # dynamic (network-level) encoder width, Eq. (5.2)
  h_ctx: 16                                     # static / device-context encoder width, Eq. (5.2)
  d_z: 64                                       # fused embedding z, Eq. (5.3) -- also what the partial path transmits
  h_cls: 128                                    # classifier hidden width (two hidden layers: h_cls, h_cls/2) -- the part the partial path offloads
  conditional_attention: true                   # device-state-keyed attention over z (FusionCAB)
  qae: true                                     # quantisation-aware compression of z, Eq. (5.4)
  qae_bits: 8                                   # b in Eq. (5.4)
  busy_head: true                               # busy-state forecasting head (multi-task)
  lambda_busy: 1.0                              # weight of the busy-state loss

training:
  epochs: 12
  batch_size: 256
  lr: 0.002
  weight_decay: 0.0001
  ablation_epochs: 5                            # epochs per ablation variant (Table 5.9 study)

quantization:                                   # Section 5.2.3 hybrid, sensitivity-aware scheme
  sensitivity_threshold_pts: 0.30               # a layer whose 8-bit quantisation costs more than this (accuracy points) keeps 16 bits
  protected_layers: [attn, cls_out]             # layers the thesis keeps at higher precision regardless (attention, final classifier)
  latency_repeats: 400                          # batch-1 forward passes averaged per precision

device_profile:                                 # the simulated device class (every value is a documented simulator parameter; a field
  name: "IIoT gateway class (quad-core ARM Cortex-A53)"   #   prototype replaces it with measurements, Section 5.4.5 guideline 5)
  reference_fp32_ms: 12.6                       # on-device FP32 inference of the full model (Table 5.7); the measured FP32 time of this
  compute_factor: auto                          #   machine is scaled to it (auto) or by an explicit factor
  collect_ms: 35.0                              # flow-window feature export + context sampling
  serialize_ms: 1.5
  cpu_slowdown: 25.0                            # on-device jobs stretch by (1 + cpu_slowdown x CPU^2) under the device's own load
  power_active_w: 2.4                           # CPU busy (collection, serialisation)
  power_inference_w: 3.5                        # CPU at full clock during inference
  power_idle_w: 0.3                             # waiting for the edge reply / in the queue
  power_radio_w: 1.6                            # transmitting
  battery_wh: 7.4                               # 2,000 mAh at 3.7 V

network:
  base_rtt_ms: 25.0
  rtt_jitter_ms: 6.0
  congestion_rtt_ms: 140.0                      # RTT during a congestion episode
  bandwidth_mbps: 4.0                           # uplink
  message_overhead_ms: 2.0
  edge_service_full_ms: 28.0                    # shared edge server: service time of a full-model request at zero load (x (1 + 3 load))
  edge_service_heads_ms: 3.0                    # service time of a partial (embedding) request
  link_down_prob: 0.03                          # per step, start of an outage
  outage_steps: [3, 12]

controller:                                     # Section 5.2.4
  lambda1: 1.0                                  # accuracy weight, Eq. (5.7)
  lambda2: 0.6                                  # latency weight
  lambda3: 0.6                                  # energy weight
  latency_ref_ms: 150.0                         # normalisation of the latency term
  energy_ref_j: 0.15                            # normalisation of the energy term (per request, at the powers above)
  gamma: 0.95                                   # discount, Eq. (5.8)
  episodes: 200
  steps_per_episode: 120
  epsilon_start: 1.0
  epsilon_end: 0.05
  hysteresis: 2                                 # decisions a new action must persist before a switch (Section 5.4.4, rule 3)
  eval_episodes: 12

simulation:                                     # live fleet
  n_devices: 6
  tick_seconds: 0.7
  telemetry_file: data/telemetry.jsonl

server:
  host: 127.0.0.1
  port: 8767
  open_browser: true
